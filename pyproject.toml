[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nile-observer"
version = "0.1.0"
description = "Source-attributed, geographically honest multi-sensor monitoring"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2",
  "httpx>=0.28,<1", "pyproj>=3.7,<4", "shapely>=2,<3", "numpy>=2,<3",
  "websockets>=15,<17", "python-multipart>=0.0.20,<1", "paho-mqtt>=2,<3", "pyserial>=3.5,<4",
  "python-dotenv>=1,<2",
]
[project.optional-dependencies]
vision = ["opencv-python-headless>=4.10,<5", "onnxruntime>=1.20,<2"]
sar = ["rasterio>=1.4,<2"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]
[tool.setuptools.packages.find]
where = ["backend"]
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
[tool.ruff]
line-length = 120
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
