services:
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://observer:${POSTGRES_PASSWORD:-local-development-only}@db:5432/observer
      DATA_DIR: /app/data
    volumes:
      - sensor-data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: observer
      POSTGRES_USER: observer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U observer -d observer"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
volumes:
  sensor-data:
  postgres-data:
