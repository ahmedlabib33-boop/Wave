name: NileCompanion
options:
  bundleIdPrefix: org.nileobserver
  deploymentTarget:
    iOS: '17.0'
settings:
  SWIFT_VERSION: '5.9'
targets:
  NileCompanion:
    type: application
    platform: iOS
    sources: [NileCompanion]
    info:
      path: NileCompanion/Info.plist
      properties:
        CFBundleDisplayName: Nile Observer
        NSCameraUsageDescription: Read local ARKit scene depth; camera images are not uploaded.
        NSLocationWhenInUseUsageDescription: Send your device location to your own sensor hub when you choose.
        NSMotionUsageDescription: Include device orientation in manually sent observations.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.nileobserver.companion
        TARGETED_DEVICE_FAMILY: '1,2'
